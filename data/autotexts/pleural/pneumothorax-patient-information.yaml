    url: https://thorax.bmj.com/content/78/Suppl_3/s1
    note: >-
      Management directed by symptoms and by the presence of high-risk
      characteristics rather than by size alone; conservative management as a
      legitimate option in selected patients; ambulatory devices; smoking
      cessation to reduce recurrence; advice on air travel and the permanent
      restriction on diving.
  - name: "BTS clinical statement on air travel for passengers with respiratory disease"
    url: https://www.brit-thoracic.org.uk/quality-improvement/clinical-statements/air-travel/
    note: When it is reasonable to fly after resolution.
