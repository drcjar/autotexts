name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      # Fails the build on an unknown topic or kind, a duplicate slug, a trial
      # reference that is not on respiratorytrials.org, a dead see_also, a stray
      # smart quote that would arrive in a letter as a replacement character, or
      # unbalanced field brackets.
      - name: Validate data
        run: python3 validate.py

      # The sign-in gateway is what stops the editor writing to main; check it
      # still refuses what it should.
      - name: Test editor gateway
        run: node gateway/test.mjs

      - name: Build site
        run: python3 build.py

      # The site's one promise: pressing Copy puts the plain text from the YAML
      # on the clipboard, with nothing added and nothing lost.
      - name: Check paste fidelity
        run: python3 tools/check_paste.py

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
